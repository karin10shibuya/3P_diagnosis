<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deep Psychological Assessment</title>
    <style>
        :root {
            --bg-color: #0d0d0f;
            --card-bg: #16161a;
            --accent-color: #c5a059;
            --accent-hover: #dfbc71;
            --text-main: #e1e1e6;
            --text-sub: #94949b;
            --border-color: #2a2a32;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 40px 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        /* ロゴ画像スタイル */
        .app-logo {
            width: 120px;
            height: 120px;
            object-fit: cover;
            border-radius: 50%;
            border: 2px solid var(--accent-color);
            margin: 0 auto 20px auto;
            box-shadow: 0 4px 15px rgba(197, 160, 89, 0.3);
        }

        /* ハチコ画像スタイル */
        .hachiko-img {
            width: 100px;
            height: 100px;
            object-fit: cover;
            border-radius: 12px;
            border: 1px solid var(--accent-color);
            margin: 15px auto;
        }

        h1, h2 {
            text-align: center;
            margin-bottom: 20px;
            letter-spacing: 0.05em;
        }

        h1 {
            font-size: 1.8rem;
            color: var(--accent-color);
        }

        p {
            text-align: center;
            color: var(--text-sub);
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 16px;
            background-color: var(--accent-color);
            color: #000;
            font-weight: bold;
            font-size: 1.1rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            text-align: center;
            letter-spacing: 0.05em;
        }

        .btn:hover {
            background-color: var(--accent-hover);
        }

        .btn:active {
            transform: scale(0.98);
        }

        /* クイズ画面 */
        .quiz-header {
            display: flex;
            justify-content: space-between;
            color: var(--text-sub);
            font-size: 0.9rem;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .question-text {
            font-size: 1.25rem;
            margin-bottom: 30px;
            line-height: 1.5;
            color: var(--text-main);
            text-align: left;
        }

        .choices-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .choice-btn {
            width: 100%;
            padding: 16px 20px;
            background-color: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-main);
            text-align: left;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .choice-btn:hover {
            background-color: rgba(197, 160, 89, 0.1);
            border-color: var(--accent-color);
            color: var(--accent-hover);
        }

        /* ローディング・エラー */
        .loading {
            text-align: center;
            font-size: 1.1rem;
            color: var(--text-sub);
            padding: 20px 0;
        }

        /* 結果画面 */
        .result-box {
            text-align: center;
        }

        .result-type {
            font-size: 2rem;
            color: var(--accent-color);
            margin: 15px 0 25px 0;
            font-weight: bold;
            letter-spacing: 0.05em;
        }

        .result-desc {
            text-align: left;
            background-color: rgba(0, 0, 0, 0.2);
            padding: 20px;
            border-radius: 8px;
            border-left: 4px solid var(--accent-color);
            margin-bottom: 30px;
            line-height: 1.7;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- スタート画面 -->
        <div id="start-screen">
            <!-- ロゴ画像を表示 -->
            <img src="logo.jpg" alt="Logo" class="app-logo" onerror="this.style.display='none'">
            <h1>Deep Psychological Assessment</h1>
            <p>深層心理の奥底にある本能と欲求を紐解く、全10問の選択式診断テスト。直感に従って選択してください。</p>
            <button class="btn" onclick="startQuiz()">診断を始める</button>
        </div>

        <!-- ローディング画面 -->
        <div id="loading-screen" class="hidden">
            <img src="hachiko1.jpg" alt="Hachiko" class="hachiko-img" onerror="this.style.display='none'">
            <div class="loading">深層データを構築中...</div>
        </div>

        <!-- クイズ画面 -->
        <div id="quiz-screen" class="hidden">
            <div class="quiz-header">
                <span id="stage-indicator">Front Phase (1/5)</span>
                <span id="progress-indicator">1 / 10</span>
            </div>
            <h2 id="question-container" class="question-text">ここに問題文が入ります</h2>
            <div id="choices-container" class="choices-list">
                <!-- 選択肢ボタンが動的に入ります -->
            </div>
        </div>

        <!-- 結果画面 -->
        <div id="result-screen" class="hidden">
            <div class="result-box">
                <!-- 結果画面にもハチコ画像を添えて -->
                <img id="result-hachiko" src="hachiko2.jpg" alt="Hachiko Result" class="hachiko-img" onerror="this.style.display='none'">
                <p style="margin-bottom: 5px;">あなたの診断結果は</p>
                <div id="result-type" class="result-type">--</div>
                <div id="result-desc" class="result-desc">
                    ここに解説文が入ります。
                </div>
                <button class="btn" onclick="location.reload()">もう一度診断する</button>
            </div>
        </div>
    </div>

    <script>
        const GAS_API_URL = "https://script.google.com/macros/s/AKfycbxKd0sRsasVHnLmyzYakYGemsXGAyajnCdHXoJfmID3SKvDs5jjVCkqKpAqpfd5fe8O/exec";

        let questions = [];
        let currentIndex = 0;
        let scores = { PS: 0, PH: 0, AS: 0, AH: 0 };
        let currentPhase = "front";

        async function startQuiz() {
            switchScreen("loading-screen");
            try {
                const res = await fetch(`${GAS_API_URL}?sheet=front`);
                questions = await res.json();
                currentIndex = 0;
                scores = { PS: 0, PH: 0, AS: 0, AH: 0 };
                currentPhase = "front";
                
                switchScreen("quiz-screen");
                showQuestion();
            } catch (err) {
                alert("データの取得に失敗しました。URLを確認してください。");
                switchScreen("start-screen");
            }
        }

        function showQuestion() {
            if (currentIndex >= 10) {
                showResult();
                return;
            }

            if (currentIndex === 5 && currentPhase === "front") {
                loadBackQuestions();
                return;
            }

            const q = questions[currentIndex];
            document.getElementById("progress-indicator").innerText = `${currentIndex + 1} / 10`;
            document.getElementById("stage-indicator").innerText = currentPhase === "front" ? `Phase 1 : 傾向判定 (${currentIndex + 1}/5)` : `Phase 2 : 詳細分析 (${currentIndex - 4}/5)`;
            document.getElementById("question-container").innerText = q.question;

            const choicesContainer = document.getElementById("choices-container");
            choicesContainer.innerHTML = "";

            q.choices.forEach(choice => {
                const btn = document.createElement("button");
                btn.className = "choice-btn";
                btn.innerText = choice.text;
                btn.onclick = () => selectChoice(choice.type);
                choicesContainer.appendChild(btn);
            });
        }

        async function loadBackQuestions() {
            switchScreen("loading-screen");
            try {
                const res = await fetch(`${GAS_API_URL}?sheet=back`);
                const backQuestions = await res.json();
                
                questions = questions.concat(backQuestions);
                currentPhase = "back";

                switchScreen("quiz-screen");
                showQuestion();
            } catch (err) {
                alert("後半データの取得に失敗しました。");
                switchScreen("start-screen");
            }
        }

        function selectChoice(type) {
            if (scores[type] !== undefined) {
                scores[type]++;
            }
            currentIndex++;
            showQuestion();
        }

        function showResult() {
            switchScreen("result-screen");

            let bestType = "AH";
            let maxScore = -1;
            for (let type in scores) {
                if (scores[type] > maxScore) {
                    maxScore = scores[type];
                    bestType = type;
                }
            }

            // 結果のタイプに応じてハチコ画像を動的に切り替える小ネタも入れました！
            const hachikoMap = {
                AH: "hachiko1.jpg",
                AS: "hachiko2.jpg",
                PH: "hachiko3.jpg",
                PS: "hachiko4.jpg"
            };
            if (hachikoMap[bestType]) {
                document.getElementById("result-hachiko").src = hachikoMap[bestType];
            }

            const typeNames = {
                AH: "【AHタイプ】 主導調教型 (Active × Hard)",
                AS: "【ASタイプ】 主導フェチ型 (Active × Soft)",
                PH: "【PHタイプ】 お任せ刺激型 (Passive × Hard)",
                PS: "【PSタイプ】 お任せ癒やし型 (Passive × Soft)"
            };

            const typeDescriptions = {
                AH: "あなたは「自分で主導権を握り、強烈な負荷やスリル、拘束を味わいたい」という強い欲求を持つタイプです。自らの意志で圧倒的な世界観を構築し、エキサイティングな状況をリードすることに最高の悦びを感じます。",
                AS: "あなたは「自分の美意識やこだわりを大切にし、甘さや密着を自らデザインしてリードしたい」というタイプです。スタイリッシュで洗練された空気感を好み、スマートに心地よさを追求します。",
                PH: "あなたは「自分では決めないけれど、容赦ない視覚的・肉体的な刺激や連続アタックで思考を完全にとかされたい」というタイプです。すべてを委ねた先にある、強烈な快楽の渦に溺れることに本能が惹かれます。",
                PS: "あなたは「すべてを相手に委ねて、ひたすら甘やかされたり優しく愛撫されたりして骨抜きにされたい」というタイプです。温もりに包まれ、外界の緊張から解放される至福の癒やしを最も深く求めています。"
            };

            document.getElementById("result-type").innerText = typeNames[bestType];
            document.getElementById("result-desc").innerText = typeDescriptions[bestType];
        }

        function switchScreen(screenId) {
            ["start-screen", "loading-screen", "quiz-screen", "result-screen"].forEach(id => {
                document.getElementById(id).classList.add("hidden");
            });
            document.getElementById(screenId).classList.remove("hidden");
        }
    </script>
</body>
</html>
