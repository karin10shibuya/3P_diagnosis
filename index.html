<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ハチコの深層心理・受動タイプ診断</title>
    <style>
        :root {
            --primary-color: #ff6b81;
            --secondary-color: #ff4757;
            --bg-color: #fff5f6;
            --card-bg: #ffffff;
            --text-color: #2f3542;
            --border-radius: 16px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            border-radius: var(--border-radius);
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            padding: 30px;
            box-sizing: border-box;
        }

        /* ヘッダー・アバター周り */
        .header {
            text-align: center;
            margin-bottom: 25px;
        }
        .hachiko-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 3px solid var(--primary-color);
            object-fit: cover;
            margin-bottom: 10px;
            box-shadow: 0 4px 10px rgba(255, 107, 129, 0.3);
        }
        h1 {
            font-size: 20px;
            color: var(--secondary-color);
            margin: 0 0 5px 0;
        }
        .subtitle {
            font-size: 13px;
            color: #747d8c;
            margin: 0;
        }

        /* 画面共通切り替え */
        .screen {
            display: none;
        }
        .screen.active {
            display: block;
        }

        /* スタート画面 */
        .start-screen {
            text-align: center;
        }
        .name-input-box {
            margin: 20px 0;
        }
        .name-input-box input {
            width: 80%;
            padding: 12px;
            font-size: 16px;
            border: 2px solid #dfe4ea;
            border-radius: 8px;
            text-align: center;
            outline: none;
            transition: border-color 0.3s;
        }
        .name-input-box input:focus {
            border-color: var(--primary-color);
        }

        /* ボタン共通 */
        .btn {
            background: linear-gradient(135deg, #ff6b81, #ff4757);
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 71, 87, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
            width: 100%;
            max-width: 300px;
            margin-top: 15px;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 71, 87, 0.6);
        }

        /* クイズ画面 */
        .progress-bar-container {
            background: #f1f2f6;
            height: 8px;
            border-radius: 4px;
            margin-bottom: 20px;
            overflow: hidden;
        }
        .progress-bar {
            background: var(--primary-color);
            height: 100%;
            width: 0%;
            transition: width 0.3s ease;
        }
        .question-number {
            font-size: 12px;
            color: #a4b0be;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }
        .question-text {
            font-size: 17px;
            font-weight: bold;
            margin-bottom: 20px;
            line-height: 1.5;
        }
        .options-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .option-btn {
            background: #f8f9fa;
            border: 2px solid #e9ecef;
            padding: 14px 18px;
            text-align: left;
            border-radius: 12px;
            font-size: 15px;
            color: var(--text-color);
            cursor: pointer;
            transition: all 0.2s;
        }
        .option-btn:hover {
            background: #fff0f3;
            border-color: var(--primary-color);
            transform: translateX(4px);
        }

        /* 結果画面 */
        .result-screen {
            text-align: center;
        }
        .result-type-title {
            font-size: 24px;
            color: var(--secondary-color);
            font-weight: bold;
            margin-bottom: 5px;
        }
        .result-type-sub {
            font-size: 14px;
            color: #747d8c;
            margin-bottom: 15px;
        }
        .killer-word-box {
            background: #fff0f3;
            border-left: 4px solid var(--secondary-color);
            padding: 15px;
            border-radius: 0 12px 12px 0;
            text-align: left;
            margin-bottom: 20px;
            font-size: 15px;
            font-weight: bold;
            color: #d63031;
            line-height: 1.4;
        }

        /* 座標マップデザイン（左上:あくそふ, 右上:あくはー, 左下:ぱっそふ, 右下:ぱっはー） */
        .coordinate-plane {
            position: relative;
            width: 260px;
            height: 260px;
            margin: 20px auto;
            background: #fafafa;
            border: 2px solid #2f3542;
            border-radius: 12px;
            overflow: hidden;
        }
        .quadrant {
            position: absolute;
            width: 50%;
            height: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: bold;
            color: #a4b0be;
            text-align: center;
            padding: 5px;
            box-sizing: border-box;
        }
        .quadrant span { font-size: 8px; font-weight: normal; }
        .q-as { top: 0; left: 0; background: rgba(255, 182, 193, 0.15); } /* 左上：あくそふ */
        .q-ah { top: 0; right: 0; background: rgba(255, 105, 180, 0.15); } /* 右上：あくはー */
        .q-ps { bottom: 0; left: 0; background: rgba(135, 206, 235, 0.15); } /* 左下：ぱっそふ */
        .q-ph { bottom: 0; right: 0; background: rgba(147, 112, 219, 0.15); } /* 右下：ぱっはー */
        
        .axis-x { position: absolute; top: 50%; width: 100%; height: 1px; background: #dfe4ea; }
        .axis-y { position: absolute; left: 50%; height: 100%; width: 1px; background: #dfe4ea; }
        
        .user-pointer {
            position: absolute;
            transform: translate(-50%, -50%);
            transition: all 1s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 10;
            text-align: center;
        }
        .pointer-icon {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 2px solid var(--secondary-color);
            background: #fff;
            box-shadow: 0 3px 6px rgba(0,0,0,0.2);
            object-fit: cover;
        }
        .pointer-label {
            display: block;
            font-size: 9px;
            font-weight: bold;
            background: var(--secondary-color);
            color: #fff;
            padding: 1px 4px;
            border-radius: 4px;
            margin-top: 1px;
        }

        .recommendation-box {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 15px;
            margin-top: 20px;
            text-align: left;
        }
        .recommendation-box h4 {
            margin: 0 0 8px 0;
            font-size: 14px;
            color: var(--text-color);
        }
        .staff-link {
            display: inline-block;
            background: #2ed573;
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 14px;
            margin-top: 10px;
            transition: background 0.2s;
            text-align: center;
            width: 100%;
            box-sizing: border-box;
        }
        .staff-link:hover {
            background: #26af5f;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- スタート画面 -->
    <div id="start-screen" class="screen active start-screen">
        <img src="hachiko_face.png" alt="ハチコ" class="hachiko-avatar" onerror="this.src='https://via.placeholder.com/80?text=Hachiko'">
        <h1>ハチコの深層心理診断</h1>
        <p class="subtitle">〜 あなたの「愛され方・受動の好み」を丸裸にします 〜</p>
        
        <div class="name-input-box">
            <input type="text" id="user-name" placeholder="お名前を入力（空欄ならご主人様）">
        </div>
        
        <button class="btn" onclick="startQuiz()">診断を始める 🐾</button>
    </div>

    <!-- クイズ画面 -->
    <div id="quiz-screen" class="screen">
        <div class="progress-bar-container">
            <div id="progress-bar" class="progress-bar"></div>
        </div>
        <div id="question-number" class="question-number">QUESTION 1 / 10</div>
        <div id="question-text" class="question-text">読み込み中...</div>
        <div id="options-container" class="options-container"></div>
    </div>

    <!-- 結果画面 -->
    <div id="result-screen" class="screen result-screen">
        <img src="hachiko_face.png" alt="ハチコ" class="hachiko-avatar" onerror="this.src='https://via.placeholder.com/80?text=Hachiko'">
        <div id="greeting-text" class="subtitle"></div>
        <h2 class="result-type-title" id="result-title"></h2>
        <div class="result-type-sub" id="result-subtitle"></div>
        
        <div class="killer-word-box" id="killer-word"></div>

        <!-- 変態ポジショニングマップ -->
        <h3 style="font-size:14px; margin: 15px 0 5px 0;">🗺️ あなたの変態ポジショニングマップ</h3>
        <div class="coordinate-plane">
            <div class="quadrant q-as">あくそふ<br><span>(こだわり×ソフト)</span></div>
            <div class="quadrant q-ah">あくはー<br><span>(こだわり×ハード)</span></div>
            <div class="quadrant q-ps">ぱっそふ<br><span>(丸投げ×ソフト)</span></div>
            <div class="quadrant q-ph">ぱっはー<br><span>(丸投げ×ハード)</span></div>
            <div class="axis-x"></div>
            <div class="axis-y"></div>
            
            <div id="user-pointer" class="user-pointer" style="left: 50%; top: 50%;">
                <img src="hachiko_face.png" alt="YOU" class="pointer-icon" onerror="this.src='https://via.placeholder.com/36?text=YOU'">
                <span class="pointer-label">YOU!</span>
            </div>
        </div>

        <div class="recommendation-box">
            <h4 id="rec-title">おすすめの担当キャスト</h4>
            <p id="rec-desc" style="font-size:13px; color:#666; margin:0;"></p>
            <a id="rec-link" href="#" target="_blank" class="staff-link">このタイプのプロフィールを見る ↗</a>
        </div>

        <button class="btn" onclick="resetQuiz()" style="margin-top: 25px;">もう一度診断する</button>
    </div>
</div>

<script>
    // データベース：前半プール（性格編）と後半プール（エロ受動編）
    const poolPart1 = [
        {
            text: "休日に、自分の知らない新しいお店へ行くときの行動は？",
            options: [
                { text: "事前にネットやSNSで口コミを徹底的に調べ、一番良さそうな席やメニューを予習してから向かう", x: 1.0, y: 0 },
                { text: "気になった看板や雰囲気に惹かれて、自分の直感だけでふらっと足を踏み入れる", x: 0.5, y: 0 },
                { text: "「どこでもいいよ」と言われたら、相手の行きたい提案にニコニコしてそのまま乗っかる", x: -0.5, y: 0 },
                { text: "正直めんどくさいので、お気に入りの定番の場所以外はあまり行きたくない", x: -1.0, y: 0 }
            ]
        },
        {
            text: "カフェや飲食店で、注文を決めるときのあなたのスタイルは？",
            options: [
                { text: "自分の中で「今日の気分はこれ」と決まっているものがハッキリあり、それをブレずに頼む", x: 1.0, y: 0 },
                { text: "メニューの見た目やネーミングの面白さに惹かれて、その場のノリで直感的に決める", x: 0.5, y: 0 },
                { text: "迷ったら周囲の人や連れの「おすすめは何？」と聞いて、そのまま同じものを頼みがち", x: -0.5, y: 0 },
                { text: "失敗するのが一番嫌なので、一番無難でハズレのない定番メニューを確実に選ぶ", x: -1.0, y: 0 }
            ]
        },
        {
            text: "グループや仕事で、思い通りにならないトラブルが起きたときは？",
            options: [
                { text: "いったん深呼吸して、自分が主導権を握ってスマートに軌道修正しようと動く", x: 1.0, y: 0 },
                { text: "「なんとかなる精神」でその場のノリと勢いに身を任せ、流れの変化を楽しむ", x: 0.5, y: 0 },
                { text: "「まぁ、なるようにしかならないか」と、あまり深く考えず周りの動きに合わせる", x: -0.5, y: 0 },
                { text: "余計な波風を立てたくないので、できるだけ当たり障りないポジションでやり過ごす", x: -1.0, y: 0 }
            ]
        },
        {
            text: "人から何かを教えてもらうとき、心の中でどう思いがち？",
            options: [
                { text: "「自分のやり方や美学とはちょっと違うけど…まぁ、言われた通りにしておくか」", x: 1.0, y: 0 },
                { text: "「お、それ面白そうだな！」と、新しい刺激やノリをそのまま素直に吸収する", x: 0.5, y: 0 },
                { text: "「はい、分かりました！」と特に深く考えず、言われたとおりにテキパキこなす", x: -0.5, y: 0 },
                { text: "「めんどくさいな…できれば全部代わりにやってくれないかな」と内心思っている", x: -1.0, y: 0 }
            ]
        },
        {
            text: "完全に自由な休日ができたとき、目覚めて最初にすることは？",
            options: [
                { text: "「今日はこれをやる」と決めたスケジュールを頭の中で組み立ててから起き上がる", x: 1.0, y: 0 },
                { text: "「せっかくだし、思いっきり遠出しようかな」とその日の勢いで行き先を決める", x: 0.5, y: 0 },
                { text: "特に予定は決めず、誰かからのお誘いやSNSの流れる情報にその都度反応する", x: -0.5, y: 0 },
                { text: "スマホをいじりながら、布団の中で限界までダラダラして一歩も外に出ない", x: -1.0, y: 0 }
            ]
        }
    ];

    const poolPart2 = [
        {
            text: "2人きりの静かな空間で、相手と向かい合って座ったときの理想の距離感は？",
            options: [
                { text: "自分の好みのペースに合わせて、じれったいほど丁寧に距離を縮めてきてほしい", x: -0.8, y: -0.8 }, // AS (左上)
                { text: "「まだ動いちゃダメ」と視線で逃げ場を塞がれ、じわじわと追い詰められたい", x: 0.8, y: -0.8 },  // AH (右上)
                { text: "細かいことは気にせず、ただただ深い温もりと心地よさにすっぽり包み込まれたい", x: -0.8, y: 0.8 }, // PS (左下)
                { text: "自分の意志とは関係なく、容赦ない圧倒的なアタックで一気に世界を奪われたい", x: 0.8, y: 0.8 }   // PH (右下)
            ]
        },
        {
            text: "耳元でふとささやかれたとき、一番ゾクッとするニュアンスは？",
            options: [
                { text: "「ねぇ、今の私の表情、どう見えてる…？」と、お互いの色気や空気感をじっくり味わう言葉", x: -0.8, y: -0.8 },
                { text: "「私の言うこと、ちゃんと聞けるよね？」と、有無を言わせず主導権を奪っていく言葉", x: 0.8, y: -0.8 },
                { text: "「よく頑張りました、よしよし…♡」と、すべてを全肯定して甘やかしてくれる言葉", x: -0.8, y: 0.8 },
                { text: "「もう逃がさないから…」と、理性がプツンと途切れるような強烈なフレーズ", x: 0.8, y: 0.8 }
            ]
        },
        {
            text: "相手に身動きが取れなくなっているとき、頭のなかで考えていることは？",
            options: [
                { text: "「この絶妙な距離感と、最高のムードにこのままうっとり酔いしれていたい…」", x: -0.8, y: -0.8 },
                { text: "「もっと厳しくして、もっと頭がおかしくなるくらい狂わせてくれ…」", x: 0.8, y: -0.8 },
                { text: "「このまま時間が止まって、ずっとこの心地よさに包まれていたいのにな…」", x: -0.8, y: 0.8 },
                { text: "「あばばば…もう何も考えられない…どうにでもして…」", x: 0.8, y: 0.8 }
            ]
        },
        {
            text: "気持ちよさがピークに達して、理性がトローンと溶けかけているときの理想は？",
            options: [
                { text: "自分の美意識や空間の心地よさが最高潮に達し、うっとりと満たされた状態でいたい", x: -0.8, y: -0.8 },
                { text: "相手の手のひらの上で完全にコントロールされ、普段の自分を完全にへし折られたい", x: 0.8, y: -0.8 },
                { text: "すべてを包み込むような温もりと、絶対的な安心感の中でトロトロにとろけたい", x: -0.8, y: 0.8 },
                { text: "思考が完全に真っ白になって、自分の意志とは関係なく快感の波に飲み込まれたい", x: 0.8, y: 0.8 }
            ]
        },
        {
            text: "これから濃厚な時間に身を委ねる直前、心の中で密かに願っていることは？",
            options: [
                { text: "自分好みの最高のシチュエーションで、スマートにトロッとさせてほしい", x: -0.8, y: -0.8 },
                { text: "限界まで自分を追い詰めて、普段の理性を粉々に粉砕してほしい", x: 0.8, y: -0.8 },
                { text: "痛いことや面倒なことは抜きで、とにかく確実にとろけるほど気持ちよくしてほしい", x: -0.8, y: 0.8 },
                { text: "細かいことはいいから、とにかく脳の配線を焼き切るような強烈な刺激をくれ", x: 0.8, y: 0.8 }
            ]
        }
    ];

    let currentQuestions = [];
    let currentIndex = 0;
    let totalScoreX = 0;
    let totalScoreY = 0;
    let userName = "";

    function shuffleArray(array) {
        let arr = [...array];
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    function startQuiz() {
        const inputVal = document.getElementById('user-name').value.trim();
        userName = inputVal !== "" ? inputVal + "ご主人様" : "ご主人様";
        
        const shuffledPart1 = shuffleArray(poolPart1);
        const shuffledPart2 = shuffleArray(poolPart2);
        currentQuestions = [...shuffledPart1, ...shuffledPart2];

        currentIndex = 0;
        totalScoreX = 0;
        totalScoreY = 0;

        document.getElementById('start-screen').classList.remove('active');
        document.getElementById('quiz-screen').classList.add('active');
        showQuestion();
    }

    function showQuestion() {
        if (currentIndex >= currentQuestions.length) {
            showResult();
            return;
        }

        const q = currentQuestions[currentIndex];
        document.getElementById('question-number').innerText = `QUESTION ${currentIndex + 1} / ${currentQuestions.length}`;
        document.getElementById('question-text').innerText = q.text;
        
        const progressPercent = ((currentIndex) / currentQuestions.length) * 100;
        document.getElementById('progress-bar').style.width = progressPercent + '%';

        const optionsContainer = document.getElementById('options-container');
        optionsContainer.innerHTML = '';

        q.options.forEach((opt) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = opt.text;
            btn.onclick = () => selectOption(opt.x, opt.y);
            optionsContainer.appendChild(btn);
        });
    }

    function selectOption(x, y) {
        totalScoreX += x;
        totalScoreY += y;
        currentIndex++;
        showQuestion();
    }

    function showResult() {
        document.getElementById('quiz-screen').classList.remove('active');
        document.getElementById('result-screen').classList.add('active');
        document.getElementById('progress-bar').style.width = '100%';

        document.getElementById('greeting-text').innerText = `${userName}の診断結果はこちらです！`;

        let title = "";
        let subtitle = "";
        let killerWord = "";
        let recTitle = "";
        let recDesc = "";
        let recUrl = "";

        // 【座標計算】X軸:横(プラス右/マイナス左), Y軸:縦(プラス下/マイナス上)
        let posX = 50 + (totalScoreX * 8);
        let posY = 50 + (totalScoreY * 8);
        posX = Math.max(15, Math.min(85, posX));
        posY = Math.max(15, Math.min(85, posY));

        document.getElementById('user-pointer').style.left = posX + '%';
        document.getElementById('user-pointer').style.top = posY + '%';

        // 【4象限マップと判定の完全一致】
        // 左上(AS): X < 0 且つ Y < 0 (こだわり × ソフト)
        // 右上(AH): X >= 0 且つ Y < 0 (こだわり × ハード)
        // 左下(PS): X < 0 且つ Y >= 0 (丸投げ × ソフト)
        // 右下(PH): X >= 0 且つ Y >= 0 (丸投げ × ハード)

        if (totalScoreX < 0 && totalScoreY < 0) {
            // 【左上】あくそふ (こだわり×ソフト)
