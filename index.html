<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4タイプ診断 深層心理から読み解くM度合いチェッカー</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;900&display=swap');

        :root {
            --pop-pink: #ff3366;
            --pop-yellow: #ffcc00;
            --pop-blue: #00ccff;
            --pop-purple: #9933ff;
            --bg-color: #fff0f5;
            --card-bg: #ffffff;
            --text-color: #2d3436;
        }

        body {
            font-family: 'M PLUS Rounded 1c', sans-serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(#ffccd5 15%, transparent 16%), radial-gradient(#ffccd5 15%, transparent 16%);
            background-size: 20px 20px;
            background-position: 0 0, 10px 10px;
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            border-radius: 24px;
            border: 4px solid var(--text-color);
            box-shadow: 6px 6px 0px var(--text-color);
            padding: 30px;
            box-sizing: border-box;
        }

        /* アバター周り・アニメーション */
        .hachiko-avatar {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            border: 4px solid var(--text-color);
            object-fit: cover;
            margin-bottom: 10px;
            box-shadow: 3px 3px 0px var(--text-color);
            background: var(--pop-yellow);
        }

        /* ハチコがぴょこぴょこ動くアニメーション */
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
        .bounce-anim {
            animation: bounce 1.5s infinite ease-in-out;
        }

        h1 {
            font-size: 20px;
            font-weight: 900;
            color: var(--pop-pink);
            margin: 0 0 5px 0;
            text-shadow: 2px 2px 0px var(--text-color);
        }
        .subtitle {
            font-size: 13px;
            font-weight: 700;
            color: #636e72;
            margin: 0;
        }

        /* 画面共通切り替え */
        .screen {
            display: none;
        }
        .screen.active {
            display: block;
        }

        /* オープニング画面（ハチコのナビ説明） */
        .intro-screen {
            text-align: center;
        }
        .speech-bubble {
            position: relative;
            background: #fff9e6;
            border: 3px solid var(--text-color);
            border-radius: 16px;
            padding: 16px;
            margin: 15px 0 25px 0;
            font-size: 14px;
            font-weight: 900;
            text-align: left;
            line-height: 1.5;
            box-shadow: 3px 3px 0px var(--text-color);
        }
        .speech-bubble::after {
            content: '';
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 0 10px 12px 10px;
            border-style: solid;
            border-color: transparent transparent var(--text-color) transparent;
        }

        /* スタート画面 */
        .start-screen {
            text-align: center;
        }
        .name-input-box {
            margin: 20px 0;
        }
        .name-input-box input {
            width: 85%;
            padding: 14px;
            font-size: 16px;
            font-family: 'M PLUS Rounded 1c', sans-serif;
            font-weight: 700;
            border: 3px solid var(--text-color);
            border-radius: 12px;
            text-align: center;
            outline: none;
            background: #fff;
            box-shadow: 3px 3px 0px var(--text-color);
        }

        /* ポップなボタン */
        .btn {
            background-color: var(--pop-yellow);
            color: var(--text-color);
            border: 3px solid var(--text-color);
            padding: 14px 28px;
            font-size: 18px;
            font-family: 'M PLUS Rounded 1c', sans-serif;
            font-weight: 900;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 4px 4px 0px var(--text-color);
            transition: transform 0.1s, box-shadow 0.1s;
            width: 100%;
            max-width: 300px;
            margin-top: 15px;
        }
        .btn:hover {
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0px var(--text-color);
        }
        .btn:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px var(--text-color);
        }

        /* クイズ画面 */
        .progress-bar-container {
            background: #dfe6e9;
            height: 14px;
            border-radius: 10px;
            border: 3px solid var(--text-color);
            margin-bottom: 20px;
            overflow: hidden;
        }
        .progress-bar {
            background: var(--pop-blue);
            height: 100%;
            width: 0%;
            transition: width 0.3s ease;
        }
        .question-number {
