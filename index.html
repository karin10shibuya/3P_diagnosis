<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ハチコの深層心理・本能アセスメント</title>
    <style>
        :root {
            --bg-color: #fff0f5;
            --card-bg: #ffffff;
            --primary-color: #ff6b9b;
            --secondary-color: #ffca3a;
            --text-main: #2b2d42;
            --text-sub: #8d99ae;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 99%, #fad0c4 100%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* ハチコ常駐バー */
        .hachiko-bar {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.95);
            border: 3px solid var(--primary-color);
            border-radius: 50px;
            padding: 8px 20px 8px 8px;
            margin-bottom: 20px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 8px 20px rgba(255, 107, 155, 0.3);
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        .hachiko-avatar {
            width: 55px;
            height: 55px;
            object-fit: cover;
            border-radius: 50%;
            border: 2px solid var(--secondary-color);
            margin-right: 15px;
        }

        .hachiko-speech {
            font-size: 0.95rem;
            font-weight: bold;
            color: var(--text-main);
            line-height: 1.4;
        }

        /* メインカード */
        .container {
            width: 100%;
            max-width: 550px;
            background-color: var(--card-bg);
            border: 4px solid #fff;
            border-radius: 24px;
            padding: 35px 25px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            text-align: center;
            position: relative;
        }

        .app-logo {
            width: 100%;
            max-width: 280px;
            height: auto;
            object-fit: contain;
            border-radius: 12px;
            margin: 0 auto 20px auto;
            display: block;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.1);
        }

        h1 {
            font-size: 1.6rem;
            color: var(--primary-color);
            margin-bottom: 15px;
            letter-spacing: 0.05em;
        }

        h2 {
            font-size: 1.2rem;
            color: var(--text-main);
            margin-bottom: 20px;
            text-align: left;
            line-height: 1.5;
        }

        p {
            color: var(--text-sub);
            margin-bottom: 25px;
            line-height: 1.6;
            font-size: 0.95rem;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #ff6b9b 0%, #ff8e53 100%);
            color: #fff;
            font-weight: bold;
            font-size: 1.1rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.2s;
            text-align: center;
            box-shadow: 0 6px 20px rgba(255, 107, 155, 0.4);
            letter-spacing: 0.05em;
            margin-top: 20px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255, 107, 155, 0.6);
        }

        .btn:active {
            transform: scale(0.98);
        }

        /* クイズ画面 */
        .quiz-header {
            display: flex;
            justify-content: space-between;
            color: var(--text-sub);
            font-size: 0.85rem;
            margin-bottom: 15px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .choices-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .choice-btn {
            width: 100%;
            padding: 16px 20px;
            background-color: #f8f9fa;
            border: 2px solid #e9ecef;
            border-radius: 14px;
            color: var(--text-main);
            text-align: left;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            outline: none;
        }

        @media (hover: hover) {
            .choice-btn:hover {
                background-color: #fff0f5;
                border-color: var(--primary-color);
                color: var(--primary-color);
                transform: translateX(4px);
            }
        }

        .choice-btn:active {
            background-color: #fff0f5;
            border-color: var(--primary-color);
            color: var(--primary-color);
        }

        /* ローディング */
        .loading {
            font-size: 1.1rem;
            color: var(--primary-color);
            font-weight: bold;
            padding: 20px 0;
        }

        /* 結果画面 */
        .result-type {
            font-size: 1.6rem;
            color: var(--primary-color);
            margin: 10px 0 20px 0;
            font-weight: bold;
            line-height: 1.3;
        }

        .result-desc {
            text-align: left;
            background-color: #f8f9fa;
            padding: 20px;
            border-radius: 14px;
            border-left: 5px solid var(--primary-color);
            margin-bottom: 20px;
            line-height: 1.7;
            font-size: 0.92rem;
        }

        /* おすすめ3Pプランカード */
        .recommend-box {
            text-align: left;
            background: linear-gradient(135deg, #fff9fb 0%, #fff0f5 100%);
            border: 2px dashed var(--primary-color);
            padding: 20px;
            border-radius: 14px;
            margin-bottom: 20px;
        }

        .recommend-title {
            font-weight: bold;
            color: var(--primary-color);
            font-size: 1.05rem;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .recommend-content {
            font-size: 0.9rem;
            color: var(--text-main);
            line-height: 1.6;
            margin-bottom: 12px;
        }

        .recommend-price {
            font-size: 0.95rem;
            font-weight: bold;
            color: #2b2d42;
            background: #fff;
            padding: 8px 12px;
            border-radius: 8px;
            display: inline-block;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <!-- ハチコ常駐バー -->
    <div class="hachiko-bar">
        <img id="hachiko-face" src="hachiko1.jpg" alt="ハチコ" class="hachiko-avatar" onerror="this.src='logo.jpg'">
        <div id="hachiko-msg" class="hachiko-msg">ご主人様、一緒に深層心理を暴いちゃおうワン！✨</div>
    </div>

    <div class="container">
        <!-- スタート画面 -->
        <div id="start-screen">
            <img src="logo.jpg" alt="Logo" class="app-logo" onerror="this.style.display='none'">
            <h1>ハチコの深層心理・本能アセスメント</h1>
            <p>ハチコと一緒にあなたの本能と欲求を丸裸にする、全10問のポップな心理テスト！直感で選んでね♪</p>
            <button class="btn" onclick="startQuiz()">診断をスタート！</button>
        </div>

        <!-- ローディング画面 -->
        <div id="loading-screen" class="hidden">
            <div class="loading">ハチコが秘密のデータを召喚中だワン…！✨</div>
        </div>

        <!-- クイズ画面 -->
        <div id="quiz-screen" class="hidden">
            <div class="quiz-header">
                <span id="stage-indicator">Phase 1 (1/5)</span>
                <span id="progress-indicator">1 / 10</span>
            </div>
            <h2 id="question-container" class="question-text">ここに問題文が入ります</h2>
            <div id="choices-container" class="choices-list">
                <!-- 選択肢ボタン -->
            </div>
        </div>

        <!-- 結果画面 -->
        <div id="result-screen" class="hidden">
            <div class="result-box">
                <p style="margin-bottom: 5px; font-weight: bold;">🎉 あなたの診断結果は……！ 🎉</p>
                <div id="result-type" class="result-type">--</div>
                <div id="result-desc" class="result-desc">
                    ここに詳細な解説文が入ります。
                </div>
                
                <!-- おすすめ3Pプラン欄 -->
                <div class="recommend-box">
                    <div class="recommend-title">💖 ハチコ的・こんな3Pがオススメ！</div>
                    <div id="recommend-content" class="recommend-content">ここにオススメの内容が入ります。</div>
                    <div id="recommend-price" class="recommend-price">💰 料金目安：--</div>
                </div>

                <button class="btn" onclick="location.reload()">もう一度遊ぶワン！</button>
            </div>
        </div>
    </div>

    <script>
        const GAS_API_URL = "https://script.google.com/macros/s/AKfycbxKd0sRsasVHnLmyzYakYGemsXGAyajnCdHXoJfmID3SKvDs5jjVCkqKpAqpfd5fe8O/exec";

        let allQuestions = [];
        let currentIndex = 0;
        let scores = { PS: 0, PH: 0, AS: 0, AH: 0 };

        const hachikoComments = [
            "ふむふむ…ご主人様はそう選んだんだワン！",
            "おっ、今の選択、なかなか奥が深いワンね〜！",
            "ハチコ、次の質問も気になっちゃうワンっ✨",
            "どんどん本性に近づいてるワン……ふふっ♪",
            "直感こそ最大の真実だワン！その調子だワンっ！"
        ];

        function setHachiko(imageName, message) {
            document.getElementById("hachiko-face").src = imageName;
            document.getElementById("hachiko-msg").innerText = message;
        }

        async function startQuiz() {
            switchScreen("loading-screen");
            setHachiko("hachiko2.jpg", "データを集めてるからちょっと待っててねワン！");
            try {
                const [resFront, resBack] = await Promise.all([
                    fetch(`${GAS_API_URL}?sheet=front`),
                    fetch(`${GAS_API_URL}?sheet=back`)
                ]);

                const frontData = await resFront.json();
                const backData = await resBack.json();

                allQuestions = frontData.concat(backData);
                currentIndex = 0;
                scores = { PS: 0, PH: 0, AS: 0, AH: 0 };
                
                switchScreen("quiz-screen");
                showQuestion();
            } catch (err) {
                alert("データの取得に失敗しちゃいました。URLを確認してね！");
                switchScreen("start-screen");
                setHachiko("hachiko1.jpg", "あれれ？通信エラーみたいだワン…泣");
            }
        }

        function showQuestion() {
            if (currentIndex >= 10) {
                showResult();
                return;
            }

            const q = allQuestions[currentIndex];
            const isFront = currentIndex < 5;

            document.getElementById("progress-indicator").innerText = `${currentIndex + 1} / 10`;
            document.getElementById("stage-indicator").innerText = isFront 
                ? `Phase 1 : 傾向判定 (${currentIndex + 1}/5)` 
                : `Phase 2 : 詳細分析 (${currentIndex - 4}/5)`;
            
            document.getElementById("question-container").innerText = q.question;

            const randomComment = hachikoComments[Math.floor(Math.random() * hachikoComments.length)];
            const randomHachikoImg = `hachiko${(currentIndex % 5) + 1}.jpg`;
            setHachiko(randomHachikoImg, randomComment);

            const choicesContainer = document.getElementById("choices-container");
            choicesContainer.innerHTML = "";

            q.choices.forEach(choice => {
                const btn = document.createElement("button");
                btn.className = "choice-btn";
                btn.innerText = choice.text;
                btn.onclick = () => selectChoice(choice.type);
                choicesContainer.appendChild(btn);
            });
        }

        function selectChoice(type) {
            if (scores[type] !== undefined) {
                scores[type]++;
            }
            currentIndex++;
            showQuestion();
        }

        function showResult() {
            switchScreen("result-screen");

            let bestType = "AH";
            let maxScore = -1;
            for (let type in scores) {
                if (scores[type] > maxScore) {
                    maxScore = scores[type];
                    bestType = type;
                }
            }

            setHachiko("hachiko1.jpg", "ご主人様の診断結果が出たワン！お疲れ様だワン♪");

            const typeNames = {
                AH: "【AHタイプ】 主導調教型 (Active × Hard)",
                AS: "【ASタイプ】 主導フェチ型 (Active × Soft)",
                PH: "【PHタイプ】 お任せ刺激型 (Passive × Hard)",
                PS: "【PSタイプ】 お任せ癒やし型 (Passive × Soft)"
            };

            const typeDescriptions = {
                AH: "あなたは「自分で主導権を握り、強烈な負荷やスリル、拘束を味わいたい」という強い欲求を持つタイプです。自らの意志で圧倒的な世界観やルールを構築し、エキサイティングな状況を自らリードすることに最高の悦びを感じます。妥協を許さない完璧主義な一面があり、ドラマチックで刺激的な展開に身を委ねることで、心の底から満たされる本能を秘めています。",
                AS: "あなたは「自分の美意識やこだわりを大切にし、甘さや密着を自らデザインしてリードしたい」というタイプです。スタイリッシュで洗練された空気感を好み、スマートに心地よさを追求します。独自の美的センスと細やかな気配りを合わせ持ち、相手との絶妙な距離感をコントロールしながら、優雅でロマンチックな世界観を創り上げることに悦びを見出します。",
                PH: "あなたは「自分では決めないけれど、容赦ない視覚的・肉体的な刺激や連続アタックで思考を完全にとかされたい」というタイプです。すべてを委ねた先にある、強烈な快楽の渦に溺れることに本能が強く惹かれます。普段の理性から解放され、圧倒的な存在感や容赦ないアプローチによって、思考が真っ白になるような非日常のスリルとトランス状態を求めています。",
                PS: "あなたは「すべてを相手に委ねて、ひたすら甘やかされたり優しく愛撫されたりして骨抜きにされたい」というタイプです。温もりに包まれ、外界の緊張から解放される至福の癒やしを最も深く求めています。包み込むような優しさと絶対的な安心感の中で、全身の力を抜き去り、心身ともにトロトロにとろけてしまうような極上のリラクゼーション体験がベストマッチです。"
            };

            // タイプ別のおすすめプランと料金
            const recommendPlans = {
                AH: {
                    content: "主導権を完全に対等（または支配的）に握り、スリルと緊張感を楽しめる『ハードシチュエーション・カスタム3Pプラン』。演出やルールにこだわり抜いた濃厚な時間をデザインします。",
                    price: "35,000円〜 / 120分"
                },
                AS: {
                    content: "洗練された空間と甘い密着感を贅沢に味わう『スタイリッシュ・アロマフェチ3Pプラン』。美しい照明と心地よい距離感の中で、五感を満たすスマートな時間を演出します。",
                    price: "30,000円〜 / 120分"
                },
                PH: {
                    content: "考える余地を与えない連続的な刺激と圧倒的密着で思考をとかす『ハード・ラッシュ快楽3Pプラン』。すべてをお任せにして、極限のトランス状態へと誘います。",
                    price: "32,000円〜 / 120分"
                },
                PS: {
                    content: "全身を優しく包み込まれ、ひたすら甘やかされて骨抜きになる『極上癒やし・トリートメント3Pプラン』。日常の疲れを完全に忘れさせる、至福のデトックス空間を提供します。",
                    price: "28,000円〜 / 120分"
                }
            };

            document.getElementById("result-type").innerText = typeNames[bestType];
            document.getElementById("result-desc").innerText = typeDescriptions[bestType];
            document.getElementById("recommend-content").innerText = recommendPlans[bestType].content;
            document.getElementById("recommend-price").innerText = `💰 料金目安：${recommendPlans[bestType].price}`;
        }

        function switchScreen(screenId) {
            ["start-screen", "loading-screen", "quiz-screen", "result-screen"].forEach(id => {
                document.getElementById(id).classList.add("hidden");
            });
            document.getElementById(screenId).classList.remove("hidden");
        }
    </script>
</body>
</html>
