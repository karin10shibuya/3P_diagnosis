<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ハチコの深層心理・本能アセスメント</title>
    <style>
        :root {
            --bg-color: #fff0f5;
            --card-bg: #ffffff;
            --primary-color: #ff6b9b;
            --primary-light: #ffe6ef;
            --secondary-color: #ffca3a;
            --text-main: #2b2d42;
            --text-sub: #6c757d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            touch-action: manipulation; 
        }

        body {
            background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 99%, #fad0c4 100%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* ハチコのおしゃべりエリア */
        .hachiko-chat-container {
            display: flex;
            align-items: center;
            gap: 15px;
            max-width: 550px;
            width: 100%;
            margin-bottom: 20px;
        }

        .hachiko-big-avatar {
            width: 110px;
            height: 110px;
            object-fit: cover;
            object-position: center 20%; 
            border-radius: 50%;
            border: 4px solid #ffffff;
            box-shadow: 0 8px 25px rgba(255, 107, 155, 0.4);
            flex-shrink: 0;
            animation: float 3s ease-in-out infinite;
            background-color: #fff;
            transform: scale(1.3);
            transform-origin: center center;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) scale(1.3); }
            50% { transform: translateY(-6px) scale(1.3); }
        }

        .hachiko-speech-bubble {
            position: relative;
            background: #ffffff;
            border: 3px solid var(--primary-color);
            border-radius: 20px;
            padding: 14px 18px;
            font-size: 0.95rem;
            font-weight: bold;
            color: var(--text-main);
            line-height: 1.4;
            box-shadow: 0 6px 20px rgba(255, 107, 155, 0.2);
            flex-grow: 1;
            text-align: left;
        }

        .hachiko-speech-bubble::before {
            content: '';
            position: absolute;
            left: -12px;
            top: 50%;
            transform: translateY(-50%);
            border-width: 8px 12px 8px 0;
            border-style: solid;
            border-color: transparent var(--primary-color) transparent transparent;
        }

        /* メインカード */
        .container {
            width: 100%;
            max-width: 550px;
            background-color: var(--card-bg);
            border: 4px solid #fff;
            border-radius: 24px;
            padding: 35px 25px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            text-align: center;
            position: relative;
        }

        .app-logo {
            width: 100%;
            max-width: 280px;
            height: auto;
            object-fit: contain;
            border-radius: 12px;
            margin: 0 auto 20px auto;
            display: block;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.1);
        }

        h1 {
            font-size: 1.6rem;
            color: var(--primary-color);
            margin-bottom: 15px;
            letter-spacing: 0.05em;
        }

        h2 {
            font-size: 1.2rem;
            color: var(--text-main);
            margin-bottom: 20px;
            text-align: left;
            line-height: 1.5;
        }

        p {
            color: var(--text-sub);
            margin-bottom: 20px;
            line-height: 1.6;
            font-size: 0.95rem;
        }

        .name-input {
            width: 100%;
            padding: 14px 20px;
            font-size: 1.05rem;
            border: 2px solid #e9ecef;
            border-radius: 50px;
            text-align: center;
            outline: none;
            margin-bottom: 20px;
            color: var(--text-main);
            background: #f8f9fa;
            transition: all 0.2s;
        }

        .name-input:focus {
            border-color: var(--primary-color);
            background: #fff0f5;
        }

        /* ボタン共通 */
        .btn {
            display: block;
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #ff6b9b 0%, #ff8e53 100%);
            color: #fff;
            font-weight: bold;
            font-size: 1.1rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.2s;
            text-align: center;
            box-shadow: 0 6px 20px rgba(255, 107, 155, 0.4);
            letter-spacing: 0.05em;
            margin-top: 15px;
            text-decoration: none;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255, 107, 155, 0.6);
        }

        .btn:active {
            transform: scale(0.98);
        }

        /* 電話ボタン */
        .btn-phone {
            background: linear-gradient(135deg, #2ec4b6 0%, #20bf6b 100%);
            box-shadow: 0 6px 20px rgba(46, 196, 182, 0.4);
        }
        .btn-phone:hover {
            box-shadow: 0 8px 25px rgba(46, 196, 182, 0.6);
        }

        /* X投稿ボタン */
        .btn-twitter {
            background: #000000;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }
        .btn-twitter:hover {
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5);
        }

        /* クイズ画面 */
        .quiz-header {
            display: flex;
            justify-content: space-between;
            color: var(--text-sub);
            font-size: 0.85rem;
            margin-bottom: 15px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .choices-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .choice-btn {
            width: 100%;
            padding: 16px 20px;
            background-color: #f8f9fa;
            border: 2px solid #e9ecef;
            border-radius: 14px;
            color: var(--text-main);
            text-align: left;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            outline: none;
        }

        @media (hover: hover) {
            .choice-btn:hover {
                background-color: #fff0f5;
                border-color: var(--primary-color);
                color: var(--primary-color);
                transform: translateX(4px);
            }
        }

        .choice-btn:active {
            background-color: #fff0f5;
            border-color: var(--primary-color);
            color: var(--primary-color);
        }

        /* ローディング */
        .loading {
            font-size: 1.1rem;
            color: var(--primary-color);
            font-weight: bold;
            padding: 20px 0;
        }

        /* 結果画面のデザイン */
        .result-box {
            text-align: left;
        }

        .result-title-badge {
            text-align: center;
            font-size: 0.9rem;
            font-weight: bold;
            color: var(--primary-color);
            background: var(--primary-light);
            padding: 6px 15px;
            border-radius: 20px;
            display: table;
            margin: 0 auto 10px auto;
        }

        .result-type {
            font-size: 1.4rem;
            color: var(--text-main);
            margin: 5px 0 20px 0;
            font-weight: bold;
            line-height: 1.4;
            text-align: center;
            background: linear-gradient(135deg, #ff6b9b, #ffa502);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .result-desc {
            background-color: #f8f9fa;
            padding: 18px;
            border-radius: 14px;
            border-left: 5px solid var(--primary-color);
            margin-bottom: 20px;
            line-height: 1.8;
            font-size: 0.92rem;
            color: #495057;
        }

        /* おすすめ3Pプラン欄 */
        .recommend-box {
            background: linear-gradient(135deg, #fffdf4 0%, #fff6d6 100%);
            border: 2px solid var(--secondary-color);
            padding: 18px;
            border-radius: 14px;
            margin-bottom: 15px;
            box-shadow: 0 4px 15px rgba(255, 202, 58, 0.15);
        }

        .recommend-title {
            font-weight: bold;
            color: #d4a373;
            font-size: 0.95rem;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .recommend-content {
            font-size: 0.9rem;
            color: var(--text-main);
            line-height: 1.6;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <!-- ハチコのお顔クローズアップエリア -->
    <div class="hachiko-chat-container">
        <img id="hachiko-face" src="hachiko1.jpg" alt="ハチコ" class="hachiko-big-avatar" onerror="this.src='logo.jpg'">
        <div id="hachiko-msg" class="hachiko-speech-bubble">お名前を教えてくれたら、ハチコが一緒に診断してあげるワン！✨（空欄でもOKだワン）</div>
    </div>

    <div class="container">
        <!-- スタート画面 -->
        <div id="start-screen">
            <img src="logo.jpg" alt="Logo" class="app-logo" onerror="this.style.display='none'">
            <h1>ハチコの深層心理・本能アセスメント</h1>
            <p>あなたの本能と欲求を丸裸にする、全10問のポップな心理テスト！</p>
            <input type="text" id="user-name-input" class="name-input" placeholder="お名前（例：太郎）※空欄ならご主人様" maxlength="20">
            <button class="btn" onclick="startQuiz()">診断をスタート！</button>
        </div>

        <!-- ローディング画面 -->
        <div id="loading-screen" class="hidden">
            <div class="loading" id="loading-text">ハチコが秘密のデータを召喚中だワン…！✨</div>
        </div>

        <!-- クイズ画面 -->
        <div id="quiz-screen" class="hidden">
            <div class="quiz-header">
                <span id="stage-indicator">Phase 1 (1/5)</span>
                <span id="progress-indicator">1 / 10</span>
            </div>
            <h2 id="question-container" class="question-text">ここに問題文が入ります</h2>
            <div id="choices-container" class="choices-list">
                <!-- 選択肢ボタン -->
            </div>
        </div>

        <!-- 結果画面 -->
        <div id="result-screen" class="hidden">
            <div class="result-box">
                <div class="result-title-badge"><span id="result-name-badge">--</span>の診断結果発表</div>
                <div id="result-type" class="result-type">--</div>
                
                <div id="result-desc" class="result-desc">
                    ここに詳細な解説文が入ります。
                </div>
                
                <!-- おすすめ3Pプラン欄 -->
                <div class="recommend-box">
                    <div class="recommend-title">💖 ハチコ的・こんな3Pがオススメ！</div>
                    <div id="recommend-content" class="recommend-content">ここにオススメの内容が入ります。</div>
                </div>
            </div>

            <!-- アクションボタン群 -->
            <a id="phone-btn" href="tel:0354591332" class="btn btn-phone">📞 お店に電話する</a>
            <a id="twitter-btn" href="#" target="_blank" class="btn btn-twitter">𝕏 Xに投稿する</a>
            <button class="btn" onclick="location.reload()">もう一度遊ぶワン！</button>
        </div>
    </div>

    <script>
        const GAS_API_URL = "https://script.google.com/macros/s/AKfycbxKd0sRsasVHnLmyzYakYGemsXGAyajnCdHXoJfmID3SKvDs5jjVCkqKpAqpfd5fe8O/exec";

        let allQuestions = [];
        let currentIndex = 0;
        let scores = { PS: 0, PH: 0, AS: 0, AH: 0 };
        let displayName = "ご主人様"; // 常にリセットされる基本値
        let currentBestTypeName = "";

        const hachikoComments = [
            "ふむふむ…[NAME]はそう選んだんだワン！",
            "おっ、今の選択、なかなか奥が深いワンね〜！",
            "ハチコ、次の質問も気になっちゃうワンっ✨",
            "どんどん本性に近づいてるワン……ふふっ♪",
            "直感こそ最大の真実だワン！その調子だワンっ！"
        ];

        function setHachiko(imageName, message) {
            document.getElementById("hachiko-face").src = imageName;
            // テンプレート内の [NAME] を一度だけ確実に置き換える
            const personalizedMsg = message.replace(/[NAME]/g, displayName);
            document.getElementById("hachiko-msg").innerText = personalizedMsg;
        }

        async function startQuiz() {
            const inputVal = document.getElementById("user-name-input").value.trim();
            
            // ★名前の重複を防ぐため、毎回必ずクリーンな状態から組み立てる
            if (inputVal !== "") {
                displayName = inputVal + "ご主人様";
            } else {
                displayName = "ご主人様";
            }

            switchScreen("loading-screen");
            setHachiko("hachiko2.jpg", "[NAME]のデータを集めてるからちょっと待っててねワン！");
            
            try {
                const [resFront, resBack] = await Promise.all([
                    fetch(`${GAS_API_URL}?sheet=front`),
                    fetch(`${GAS_API_URL}?sheet=back`)
                ]);

                const frontData = await resFront.json();
                const backData = await resBack.json();

                allQuestions = frontData.concat(backData);
                currentIndex = 0;
                scores = { PS: 0, PH: 0, AS: 0, AH: 0 };
                
                switchScreen("quiz-screen");
                showQuestion();
            } catch (err) {
                alert("データの取得に失敗しちゃいました。URLを確認してね！");
                switchScreen("start-screen");
                setHachiko("hachiko1.jpg", "あれれ？通信エラーみたいだワン…泣");
            }
        }

        function showQuestion() {
            if (currentIndex >= 10) {
                showResult();
                return;
            }

            const q = allQuestions[currentIndex];
            const isFront = currentIndex < 5;

            document.getElementById("progress-indicator").innerText = `${currentIndex + 1} / 10`;
            document.getElementById("stage-indicator").innerText = isFront 
                ? `Phase 1 : 傾向判定 (${currentIndex + 1}/5)` 
                : `Phase 2 : 詳細分析 (${currentIndex - 4}/5)`;
            
            document.getElementById("question-container").innerText = q.question;

            // 1問目は固定の挨拶、2問目以降はランダムセリフ
            if (currentIndex === 0) {
                setHachiko("hachiko1.jpg", `いよいよ診断スタートだワン！[NAME]と一緒に深層心理を暴いていくワンよ〜！✨`);
            } else {
                const rawComment = hachikoComments[Math.floor(Math.random() * hachikoComments.length)];
                const randomHachikoImg = `hachiko${(currentIndex % 5) + 1}.jpg`;
                setHachiko(randomHachikoImg, rawComment);
            }

            const choicesContainer = document.getElementById("choices-container");
            choicesContainer.innerHTML = "";

            q.choices.forEach(choice => {
                const btn = document.createElement("button");
                btn.className = "choice-btn";
                btn.innerText = choice.text;
                btn.onclick = () => selectChoice(choice.type);
                choicesContainer.appendChild(btn);
            });
        }

        function selectChoice(type) {
            if (scores[type] !== undefined) {
                scores[type]++;
            }
            currentIndex++;
            showQuestion();
        }

        function showResult() {
            switchScreen("result-screen");

            let bestType = "AH";
            let maxScore = -1;
            for (let type in scores) {
                if (scores[type] > maxScore) {
                    maxScore = scores[type];
                    bestType = type;
                }
            }

            setHachiko("hachiko1.jpg", `${displayName}の診断結果が出たワン！お疲れ様だワン♪`);

            const typeNames = {
                AH: "【AHタイプ】 主導調教型 (Active × Hard)",
                AS: "【ASタイプ】 主導フェチ型 (Active × Soft)",
                PH: "【PHタイプ】 お任せ刺激型 (Passive × Hard)",
                PS: "【PSタイプ】 お任せ癒やし型 (Passive × Soft)"
            };

            const typeDescriptions = {
                AH: "あなたは「自分で主導権を握り、強烈な負荷やスリル、拘束を味わいたい」という強い欲求を持つタイプです。自らの意志で圧倒的な世界観やルールを構築し、エキサイティングな状況を自らリードすることに最高の悦びを感じます。妥協を許さない完璧主義な一面があり、ドラマチックで刺激的な展開に身を委ねることで、心の底から満たされる本能を秘めています。",
                AS: "あなたは「自分の美意識やこだわりを大切にし、甘さや密着を自らデザインしてリードしたい」というタイプです。スタイリッシュで洗練された空気感を好み、スマートに心地よさを追求します。独自の美的センスと細やかな気配りを合わせ持ち、相手との絶妙な距離感をコントロールしながら、優雅でロマンチックな世界観を創り上げることに悦びを見出します。",
                PH: "あなたは「自分では決めないけれど、容赦ない視覚的・肉体的な刺激や連続アタックで思考を完全にとかされたい」というタイプです。すべてを委ねた先にある、強烈な快楽の渦に溺れることに本能が強く惹かれます。普段の理性から解放され、圧倒的な存在感や容赦ないアプローチによって、思考が真っ白になるような非日常のスリルとトランス状態を求めています。",
                PS: "あなたは「すべてを相手に委ねて、ひたすら甘やかされたり優しく愛撫されたりして骨抜きにされたい」というタイプです。温もりに包まれ、外界の緊張から解放される至福の癒やしを最も深く求めています。包み込むような優しさと絶対的な安心感の中で、全身の力を抜き去り、心身ともにトロトロにとろけてしまうような極上のリラクゼーション体験がベストマッチです。"
            };

            const recommendPlans = {
                AH: "主導権を完全に対等（または支配的）に握り、スリルと緊張感を楽しめる『ハードシチュエーション・カスタム3Pプラン』。演出やルールにこだわり抜いた濃厚な時間をデザインします。",
                AS: "洗練された空間と甘い密着感を贅沢に味わう『スタイリッシュ・アロマフェチ3Pプラン』。美しい照明と心地よい距離感の中で、五感を満たすスマートな時間を演出します。",
                PH: "考える余地を与えない連続的な刺激と圧倒的密着で思考をとかす『ハード・ラッシュ快楽3Pプラン』。すべてをお任せにして、極限のトランス状態へと誘います。",
                PS: "全身を優しく包み込まれ、ひたすら甘やかされて骨抜きになる『極上癒やし・トリートメント3Pプラン』。日常の疲れを完全に忘れさせる、至福のデトックス空間を提供します。"
            };

            currentBestTypeName = typeNames[bestType];

            document.getElementById("result-name-badge").innerText = displayName;
            document.getElementById("result-type").innerText = currentBestTypeName;
            document.getElementById("result-desc").innerText = typeDescriptions[bestType];
            document.getElementById("recommend-content").innerText = recommendPlans[bestType];

            const tweetText = encodeURIComponent(`${displayName}の診断結果は「${currentBestTypeName}」でした！✨\n\nハチコと一緒にあなたも本能を診断してみない？\n#ハチコ診断 #深層心理`);
            const tweetUrl = `https://twitter.com/intent/tweet?text=${tweetText}&url=${encodeURIComponent(window.location.href)}`;
            document.getElementById("twitter-btn").href = tweetUrl;
        }

        function switchScreen(screenId) {
            ["start-screen", "loading-screen", "quiz-screen", "result-screen"].forEach(id => {
                document.getElementById(id).classList.add("hidden");
            });
            document.getElementById(screenId).classList.remove("hidden");
        }
    </script>
</body>
</html>
